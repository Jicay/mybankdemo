spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  sql:
    init:
      mode: never
  batch:
    job:
      # Jobs are launched through POST /api/batch/import-transactions, not at startup
      enabled: false
  cloud:
    function:
      definition: transactions
    stream:
      bindings:
        transactions-in-0:
          destination: transactions
          group: mybank-transactions

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: 3600
